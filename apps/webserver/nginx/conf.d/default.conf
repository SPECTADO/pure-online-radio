server {
    listen 80;
    server_name _;

    # Docker's embedded DNS (127.0.0.11 on any user-defined bridge network).
    # Without this, nginx resolves each proxy_pass hostname once at config-load
    # time and hard-crashes ("host not found in upstream") if that container
    # isn't registered on the network yet — a real startup race we hit with
    # `encoder` (slower to start than webserver: connects NATS, spawns ffmpeg,
    # opens the FIFO). Using a variable + this resolver makes nginx re-resolve
    # lazily per-request instead, so a not-yet-ready or later-restarted
    # upstream degrades to a request-time error rather than nginx refusing to
    # start at all.
    resolver 127.0.0.11 valid=10s;

    # --- Public player SPA (served at root) ---
    location / {
        root /usr/share/nginx/html/player;
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated — it references hashed asset
    # filenames (index-<hash>.js/.css) that change on every rebuild. Without
    # this, a browser can serve a cached index.html referencing asset
    # filenames from a *previous* build that no longer exist on disk (404s),
    # since the generic `/` location above has no cache-control of its own
    # and nginx's defaults leave that entirely up to browser heuristics.
    location = /index.html {
        root /usr/share/nginx/html/player;
        add_header Cache-Control "no-cache" always;
    }

    # Served from a container-local writable path (NOT the read-only static_assets
    # volume) since the entrypoint generates this file fresh on every container start.
    location = /env-config.js {
        root /etc/nginx/generated;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }

    # Bare "/manage" (no trailing slash) does NOT match the "/manage/" prefix
    # location below — nginx prefix matching requires the request URI to
    # literally start with the full location string, slash included. Without
    # this redirect, "/manage" silently falls through to the "/" location
    # instead and serves the *player* app's index.html — no error, just the
    # wrong app, which is worse than a 404 to debug.
    # $http_host (not $host) deliberately — $host drops the port, and nginx's
    # own notion of "standard port" is based on what it listens on *inside*
    # the container (80), not the externally-mapped WEBSERVER_HOST_PORT (e.g.
    # 8000). A bare `return 301 /manage/;` would have nginx silently build the
    # Location header against its internal port instead of the one the client
    # actually connected through. $http_host is the raw incoming Host header,
    # so it always matches whatever port the client really used.
    location = /manage {
        return 301 $scheme://$http_host/manage/;
    }

    # --- Control panel SPA (path-scoped: same origin as the API, no CORS needed) ---
    location /manage/ {
        alias /usr/share/nginx/html/control-panel/;
        try_files $uri $uri/ /manage/index.html;
    }

    # Same reasoning as /index.html above.
    location = /manage/index.html {
        alias /usr/share/nginx/html/control-panel/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Long-lived hashed assets get aggressive caching. Scoped separately per SPA
    # (rather than one generic `location ~* \.(js|css|...)$`) because regex
    # locations always win over prefix locations in nginx regardless of file
    # order — a single generic regex location here would silently steal every
    # asset request from both `/` and `/manage/` above, and since it defines no
    # `root`/`alias` of its own it'd fall back to nginx's compiled-in default
    # document root instead of either SPA's real one, 404ing every asset.
    location ~* ^/assets/(.+\.(?:js|css|woff2?|png|jpg|jpeg|svg|ico))$ {
        alias /usr/share/nginx/html/player/assets/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* ^/manage/assets/(.+\.(?:js|css|woff2?|png|jpg|jpeg|svg|ico))$ {
        alias /usr/share/nginx/html/control-panel/assets/$1;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- API reverse proxy ---
    location /api/ {
        # A variable in proxy_pass (needed for the lazy-resolve behavior above)
        # disables nginx's normal "replace the matched location prefix"
        # rewriting of the upstream URI — it would otherwise forward the
        # literal path "/" for every request, dropping the rest of the URL.
        # The fix: rewrite off the "/api" prefix ourselves first, then give
        # proxy_pass no URI part at all, which always forwards the (already
        # rewritten) current request URI unchanged, variable or not.
        # `set` MUST come before `rewrite ... break` — break halts all
        # further rewrite-phase directives in this location, `set` included,
        # so reversing this order leaves $api_upstream uninitialized.
        set $api_upstream api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- HLS output (written by the encoder into the shared hls_output volume) ---
    location ~* \.m3u8$ {
        root /var/www/hls;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { application/vnd.apple.mpegurl m3u8; }
        default_type application/vnd.apple.mpegurl;
    }

    location ~* \.ts$ {
        root /var/www/hls;
        add_header Cache-Control "public, max-age=30" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { video/mp2t ts; }
        default_type video/mp2t;
    }

    # --- NATS websocket (realtime status for the control panel, subscribe-only credential) ---
    location /realtime/ {
        set $nats_upstream nats:9222;
        rewrite ^/realtime/(.*)$ /$1 break;
        proxy_pass http://$nats_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Encoder live-mic ingestion websocket ---
    location /live-mic/ {
        set $encoder_upstream encoder:8080;
        rewrite ^/live-mic/(.*)$ /$1 break;
        proxy_pass http://$encoder_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
