# Used explicitly via `-f docker-compose.yml -f docker-compose.prod.yml` — never auto-merged.
# No bind mounts, pre-built/tagged images, restart policies for long-running services.

services:
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  minio:
    restart: unless-stopped

  nats:
    restart: unless-stopped

  api:
    restart: unless-stopped

  encoder:
    restart: unless-stopped

  webserver:
    restart: unless-stopped
